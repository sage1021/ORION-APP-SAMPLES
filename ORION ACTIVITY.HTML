<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORION - Activity</title>
    <link rel="stylesheet" href="Qwen.css" />
    <link rel="icon" type="image/x-icon" href="media/MINI LOGO 1.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <div class="logo-div">
          <img src="media/LOGO 1.jpg" alt="ORION Logo" class="logo" />
        </div>

        <div class="header-actions">
          <button class="icon-btn">
            <i class="fa-regular fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <h2 class="page-title">Activity</h2>

      <div class="list-card">
        <div class="list-item">
          <img src="media/halo.jpg" class="notif-avatar" alt="Alex" />
          <div class="notif-text">
            <b>Alex Rivera</b> liked your photo.<span class="notif-time"
              >2 hours ago</span
            >
          </div>
        </div>
        <div class="list-item">
          <img src="media/meme 2 naruto.jpg" class="notif-avatar" alt="Sarah" />
          <div class="notif-text">
            <b>Sarah Chen</b> started following you.<span class="notif-time"
              >5 hours ago</span
            >
          </div>
        </div>
        <div class="list-item">
          <img src="media/lagbaja.jpg" class="notif-avatar" alt="John" />
          <div class="notif-text">
            <b>John Martinez</b> commented: "Amazing shot! "<span
              class="notif-time"
              >1 day ago</span
            >
          </div>
        </div>
        <div class="list-item">
          <img src="media/wind breaker..jpg" class="notif-avatar" alt="Emma" />
          <div class="notif-text">
            <b>Emma Wilson</b> mentioned you in a story.<span class="notif-time"
              >2 days ago</span
            >
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="QWEN2.html" class="nav-item"
        ><i class="fa-solid fa-house"></i><span>Home</span></a
      >
      <a href="search.html" class="nav-item"
        ><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a
      >
      <a href="create.html" class="nav-item"
        ><i class="fa-regular fa-square-plus"></i><span>Create</span></a
      >
      <a href="notifications.html" class="nav-item active"
        ><i class="fa-regular fa-heart"></i><span>Activity</span></a
      >
      <a href="profile.html" class="nav-item"
        ><i class="fa-regular fa-user"></i><span>Profile</span></a
      >
    </nav>
  </body>
</html>
