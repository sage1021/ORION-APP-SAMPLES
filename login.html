<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="media/MINI LOGO 2.jpg" />
    <link rel="stylesheet" href="login.CSS" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>ORION - Login</title>

    <style>
      /* ================= AUTH MESSAGES ================= */
      .auth-message {
        display: none;
        padding: 10px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 10px;
        text-align: center;
        animation: fadeInMsg 0.3s ease;
      }
      @keyframes fadeInMsg {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .auth-message.error {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .auth-message.success {
        background: rgba(34, 197, 94, 0.2);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }

      /* ================= PASSWORD TOGGLE ================= */
      .toggle-pass {
        position: absolute;
        top: 50%;
        right: 17px;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        cursor: pointer;
        padding: 5px;
        transition: 0.2s;
      }
      .toggle-pass:hover {
        color: #fff;
      }

      /* ================= LOADING STATE ================= */
      .submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .submit .fa-spinner {
        margin-right: 8px;
      }

      /* ================= FORM RESET ================= */
      form {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!-- ================= SPLASH SCREEN ================= -->
    <div id="splash-screen">
      <div class="splash-content">
        <img
          src="media/MINI_LOGO no bg.png"
          alt="Orion Logo"
          class="splash-logo"
        />
        <div class="loading-ring"></div>
      </div>
    </div>

    <nav class="nav">
      <div class="logo">
        <div class="logo-div">
          <h1>
            <img
              src="media/orion_logo_ GRADIENT no bg.png"
              alt="logo"
              style="width: 120px; height: auto"
            />
          </h1>
        </div>
      </div>
      <div class="nav-button">
        <button class="btn green-btn" id="loginBtn">Login</button>
        <button class="btn green-btn" id="registerBtn">Sign Up</button>
      </div>
    </nav>

    <!-- ================= FORM BOX ================= -->
    <div class="wrapper">
      <div class="form-box">
        <!-- ========== LOGIN FORM ========== -->
        <div class="login-container" id="loginForm">
          <div class="top">
            <span
              >Don't have an account?
              <a href="#" class="link-register">Sign up</a></span
            >
          </div>
          <header>Login</header>

          <!-- Error / Success Message -->
          <div class="auth-message" id="loginMessage"></div>

          <form id="loginFormEl">
            <div class="input-box">
              <input
                type="email"
                class="input-field"
                id="loginEmail"
                placeholder="Email"
                required
              />
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
              <input
                type="password"
                class="input-field"
                id="loginPassword"
                placeholder="Password"
                required
              />
              <i class="fa-solid fa-lock"></i>
              <button
                type="button"
                class="toggle-pass"
                data-target="loginPassword"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="input-box">
              <button type="submit" class="submit" id="loginSubmitBtn">
                Login
              </button>
            </div>
          </form>

          <div class="two-col">
            <div class="one">
              <input type="checkbox" id="login-check" checked />
              <label for="login-check">Remember me</label>
            </div>
            <div class="two">
              <label
                ><a href="#" id="forgotPasswordLink">Forgot password?</a></label
              >
            </div>
          </div>
        </div>

        <!-- ========== REGISTER FORM ========== -->
        <div class="register-container" id="registerForm">
          <div class="top">
            <span
              >Already have an account?
              <a href="#" class="link-login">Login</a></span
            >
          </div>
          <header>Sign up</header>

          <!-- Error / Success Message -->
          <div class="auth-message" id="registerMessage"></div>

          <form id="registerFormEl">
            <div class="input-box">
              <input
                type="text"
                class="input-field"
                id="regUsername"
                placeholder="Username"
                required
              />
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
              <input
                type="email"
                class="input-field"
                id="regEmail"
                placeholder="Email"
                required
              />
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
              <input
                type="password"
                class="input-field"
                id="regPassword"
                placeholder="Password (min 6 characters)"
                required
                minlength="6"
              />
              <i class="fa-solid fa-lock"></i>
              <button
                type="button"
                class="toggle-pass"
                data-target="regPassword"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="input-box">
              <button type="submit" class="submit" id="registerSubmitBtn">
                Sign up
              </button>
            </div>
          </form>

          <div class="two-col">
            <div class="one">
              <input type="checkbox" id="reg-check" required />
              <label for="reg-check"
                >I agree to <a href="#">terms & conditions</a></label
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= SPLASH SCREEN SCRIPT ================= -->
    <script>
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.classList.add("fade-out");
          setTimeout(() => {
            splash.style.display = "none";
          }, 600);
        }
      }, 1500);
    </script>

    <!-- ================= FORM SLIDE TOGGLE ================= -->
    <script>
      const loginBtn = document.getElementById("loginBtn");
      const registerBtn = document.getElementById("registerBtn");
      const loginFormDiv = document.getElementById("loginForm");
      const registerFormDiv = document.getElementById("registerForm");
      const loginLinks = document.querySelectorAll(".link-login");
      const registerLinks = document.querySelectorAll(".link-register");

      function showLogin(e) {
        if (e) e.preventDefault();
        loginFormDiv.style.left = "4px";
        registerFormDiv.style.right = "-520px";
      }
      function showRegister(e) {
        if (e) e.preventDefault();
        loginFormDiv.style.left = "-520px";
        registerFormDiv.style.right = "4px";
      }

      loginBtn.addEventListener("click", showLogin);
      registerBtn.addEventListener("click", showRegister);
      loginLinks.forEach((link) => link.addEventListener("click", showLogin));
      registerLinks.forEach((link) =>
        link.addEventListener("click", showRegister),
      );
    </script>

    <!-- ================= FIREBASE AUTH SCRIPT ================= -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD0e21P_9lIin0GB1VGdUHAN4ZrkeEMxPI",
        authDomain: "orion--project.firebaseapp.com",
        projectId: "orion--project",
        storageBucket: "orion--project.firebasestorage.app",
        messagingSenderId: "91554323371",
        appId: "1:91554323371:web:5b5ba0c66b6d767ed6d0ee",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // ========== CHECK IF ALREADY LOGGED IN ==========
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace("QWEN2.html");
        }
      });

      // ========== HELPER: Show Messages ==========
      function showMessage(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.textContent = text;
        el.className = `auth-message ${type}`;
        el.style.display = "block";
        setTimeout(() => {
          el.style.display = "none";
        }, 5000);
      }

      // ========== HELPER: Loading State ==========
      function setLoading(btn, loading, originalText) {
        if (loading) {
          btn.disabled = true;
          btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Please wait...';
        } else {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      // ========== PASSWORD VISIBILITY TOGGLE ==========
      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.getAttribute("data-target");
          const input = document.getElementById(targetId);
          const icon = btn.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
          }
        });
      });

      // ========== REGISTER ==========
      document
        .getElementById("registerFormEl")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("regUsername").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const password = document.getElementById("regPassword").value;
          const termsChecked = document.getElementById("reg-check").checked;
          const btn = document.getElementById("registerSubmitBtn");

          if (!username || !email || !password) {
            showMessage(
              "registerMessage",
              "Please fill in all fields.",
              "error",
            );
            return;
          }
          if (password.length < 6) {
            showMessage(
              "registerMessage",
              "Password must be at least 6 characters.",
              "error",
              " MUST AT LEAST CONTAIN AN UPPERCASE, LOWERCASE , SYMBOLS AND NUMBERS",
            );
            return;
          }
          if (!termsChecked) {
            showMessage(
              "registerMessage",
              "Please agree to the terms & conditions.",
              "error",
            );
            return;
          }

          setLoading(btn, true);

          try {
            // 1. Create Firebase Auth account
            const userCredential = await createUserWithEmailAndPassword(
              auth,
              email,
              password,
            );
            const user = userCredential.user;

            // 2. Create user profile in Firestore
            await setDoc(doc(db, "users", user.uid), {
              name: username,
              email: email,
              avatar: "media/HIM.jpeg",
              status: "online",
              createdAt: serverTimestamp(),
              lastSeen: serverTimestamp(),
            });

            showMessage(
              "registerMessage",
              "Account created! Redirecting...",
              "success",
            );
            setTimeout(() => {
              window.location.replace("QWEN2.html");
            }, 1200);
          } catch (error) {
            setLoading(btn, false, "Sign up");
            let msg = "Registration failed. Please try again.";
            if (error.code === "auth/email-already-in-use")
              msg = "This email is already registered. Try logging in.";
            else if (error.code === "auth/invalid-email")
              msg = "Please enter a valid email address.";
            else if (error.code === "auth/weak-password")
              msg = "Password must be at least 6 characters.";
            showMessage("registerMessage", msg, "error");
          }
        });

      // ========== LOGIN ==========
      document
        .getElementById("loginFormEl")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;
          const rememberMe = document.getElementById("login-check").checked;
          const btn = document.getElementById("loginSubmitBtn");

          if (!email || !password) {
            showMessage(
              "loginMessage",
              "Please enter your email and password.",
              "error",
            );
            return;
          }

          setLoading(btn, true);

          try {
            // Set persistence based on "Remember me"
            if (rememberMe) {
              await setPersistence(auth, browserLocalPersistence);
            } else {
              await setPersistence(auth, browserSessionPersistence);
            }

            await signInWithEmailAndPassword(auth, email, password);

            // Update user status to online
            const user = auth.currentUser;
            if (user) {
              await setDoc(
                doc(db, "users", user.uid),
                { status: "online", lastSeen: serverTimestamp() },
                { merge: true },
              );
            }

            showMessage(
              "loginMessage",
              "Login successful! Redirecting...",
              "success",
            );
            setTimeout(() => {
              window.location.replace("QWEN2.html");
            }, 1000);
          } catch (error) {
            setLoading(btn, false, "Login");
            let msg = "Login failed. Please try again.";
            if (
              error.code === "auth/user-not-found" ||
              error.code === "auth/invalid-credential"
            )
              msg = "Invalid email or password.";
            else if (error.code === "auth/wrong-password")
              msg = "Incorrect password. Try again.";
            else if (error.code === "auth/invalid-email")
              msg = "Please enter a valid email.";
            else if (error.code === "auth/too-many-requests")
              msg = "Too many attempts. Try again later.";
            showMessage("loginMessage", msg, "error");
          }
        });

      // ========== FORGOT PASSWORD ==========
      document
        .getElementById("forgotPasswordLink")
        .addEventListener("click", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          if (!email) {
            showMessage(
              "loginMessage",
              "Enter your email above first, then click Forgot Password.",
              "error",
            );
            return;
          }
          try {
            await sendPasswordResetEmail(auth, email);
            showMessage(
              "loginMessage",
              "Password reset email sent! Check your inbox.",
              "success",
            );
          } catch (error) {
            showMessage(
              "loginMessage",
              "Could not send reset email. Check the email address.",
              "error",
            );
          }
        });
    </script>
  </body>
</html>
