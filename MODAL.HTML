<!-- Create Modal -->
<div class="modal-overlay" id="createModal">
  <div class="create-modal">
    <h2>Create New</h2>
    <div class="create-option"><i class="fa-regular fa-image"></i> Photo</div>
    <div class="create-option"><i class="fa-solid fa-video"></i> Video</div>
    <div class="create-option"><i class="fa-solid fa-film"></i> Reel</div>
  </div>
</div>

<!-- Story Viewer -->
<div class="story-viewer" id="storyViewer">
  <div class="story-progress-bar"><div class="story-progress"></div></div>
  <button class="close-story" id="closeStory"><i class="fa-solid fa-xmark"></i></button>
  <div class="story-content">
    <div class="story-user-info">
      <img src="" class="story-viewer-avatar" id="viewerAvatar">
      <span id="viewerUsername">User</span>
    </div>
    <div class="story-media-container" id="viewerMedia"></div>
  </div>
</div>
