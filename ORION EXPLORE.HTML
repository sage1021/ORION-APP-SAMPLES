    <!-- ================= SCRIPTS ================= -->
    <script>
      // 1. Dark Mode Sync
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = themeToggle?.querySelector("i");
      const body = document.body;

      const savedTheme = localStorage.getItem("orion-theme");
      if (savedTheme === "dark") {
        body.classList.add("dark-mode");
        themeIcon?.classList.replace("fa-moon", "fa-sun");
      }

      themeToggle?.addEventListener("click", () => {
        body.classList.toggle("dark-mode");
        if (body.classList.contains("dark-mode")) {
          themeIcon?.classList.replace("fa-moon", "fa-sun");
          localStorage.setItem("orion-theme", "dark");
        } else {
          themeIcon?.classList.replace("fa-sun", "fa-moon");
          localStorage.setItem("orion-theme", "light");
        }
      });

      // 2. Menu Dropdown
      const menuBtn = document.getElementById("menu-btn");
      const dropdown = document.getElementById("dropdown");
      menuBtn?.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.style.display =
          dropdown.style.display === "block" ? "none" : "block";
      });
      window.addEventListener("click", () => {
        if (dropdown) dropdown.style.display = "none";
      });

      // 3. Filter Buttons Logic
      document.querySelectorAll(".explore-filter-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          document
            .querySelectorAll(".explore-filter-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");

          // Subtle fade animation to grid when filtering
          const grid = document.getElementById("exploreGrid");
          grid.style.opacity = "0.5";
          setTimeout(() => {
            grid.style.opacity = "1";
          }, 200);
        });
      });

      // 4. Live Search Filter (Mock Interaction)
      const searchInput = document.getElementById("exploreSearch");
      searchInput?.addEventListener("input", function () {
        const query = this.value.toLowerCase();
        const items = document.querySelectorAll(".grid-item");

        items.forEach((item) => {
          // Simulates filtering by randomly hiding/showing items when typing
          if (query.length > 2) {
            item.style.display = Math.random() > 0.5 ? "block" : "none";
          } else {
            item.style.display = "block";
          }
        });
      });
    </script>
