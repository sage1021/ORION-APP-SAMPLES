<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="media/logo/MINI LOGO 1.jpg" />
    <link rel="stylesheet" href="style.Css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>ORION - Profile</title>
  </head>
  <body>
    <!-- ================= HEADER ================= -->
    <header class="main-header">
      <div class="container header-container">
        <div class="logo-div">
          <img src="media/logo/LOGO 1.jpg" alt="ORION Logo" class="logo" />
        </div>
        <div class="header-actions">
          <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </header>

    <div class="container main-content">
      <!-- ================= PROFILE HEADER ================= -->
      <section class="profile-header-section">
        <div class="profile-avatar-large">
          <img src="media/users/you.jpg" alt="Your Profile" />
        </div>

        <div class="profile-stats">
          <div class="stat-item">
            <h3>24</h3>
            <p>Posts</p>
          </div>
          <div class="stat-item">
            <h3>530</h3>
            <p>Followers</p>
          </div>
          <div class="stat-item">
            <h3>301</h3>
            <p>Following</p>
          </div>
        </div>

        <div class="profile-info-text">
          <h2>
            Joshua
            <span class="verified"
              ><i class="fa-solid fa-circle-check"></i
            ></span>
          </h2>
          <p class="username">@joshua_creates</p>
          <p class="bio">
            Building the ORION social app UI. 🚀<br />Designer & Developer.
          </p>
        </div>

        <div class="profile-actions">
          <button class="primary-btn edit-btn">Edit Profile</button>
          <button class="primary-btn share-btn">
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </div>
      </section>

      <!-- ================= PROFILE TABS ================= -->
      <div class="profile-tabs">
        <button class="tab-btn active">
          <i class="fa-solid fa-grid-2"></i> Posts
        </button>
        <button class="tab-btn">
          <i class="fa-regular fa-bookmark"></i> Saved
        </button>
        <button class="tab-btn">
          <i class="fa-regular fa-id-badge"></i> Tagged
        </button>
      </div>

      <!-- ================= POSTS GRID ================= -->
      <section class="profile-grid">
        <div class="grid-item">
          <img src="medi" alt="Post 1" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 1.2k</div>
        </div>
        <div class="grid-item">
          <img src="media/posts/post2.jpg" alt="Post 2" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 892</div>
        </div>
        <div class="grid-item">
          <img src="media/posts/post3.jpg" alt="Post 3" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 2.3k</div>
        </div>
        <div class="grid-item">
          <img src="media/posts/post4.jpg" alt="Post 4" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 567</div>
        </div>
        <div class="grid-item">
          <img src="media/posts/post1.jpg" alt="Post 5" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 430</div>
        </div>
        <div class="grid-item">
          <img src="media/posts/post2.jpg" alt="Post 6" />
          <div class="overlay"><i class="fa-solid fa-heart"></i> 1.1k</div>
        </div>
      </section>
    </div>

    <!-- ================= BOTTOM NAV ================= -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="search.html" class="nav-item">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
      </a>
      <a href="create.html" class="nav-item create-btn">
        <i class="fa-regular fa-square-plus"></i>
        <span>Create</span>
      </a>
      <a href="reels.html" class="nav-item">
        <i class="fa-solid fa-video"></i>
        <span>Reels</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </body>
</html>
