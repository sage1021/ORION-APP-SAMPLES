<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORION - Create</title>
    <link rel="icon" type="image/x-icon" href="media/MINI LOGO 1.jpg" />
    <link rel="stylesheet" href="Qwen.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <div class="container header-container">
        <div class="logo-div">
          <img src="media/LOGO 1.jpg" alt="ORION Logo" class="logo" />
        </div>
        
        <div class="header-actions">
          <button class="icon-btn">
            <i class="fa-regular fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <h2 class="page-title">Create New Post</h2>

      <div class="create-card">
        <div class="upload-area">
          <i class="fa-regular fa-image"></i>
          <p>Tap to upload photo or video</p>
        </div>
        <textarea placeholder="Write a caption..."></textarea>
        <button class="post-btn">Share Post</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="QWEN2.html" class="nav-item"
        ><i class="fa-solid fa-house"></i><span>Home</span></a
      >
      <a href="search.html" class="nav-item"
        ><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a
      >
      <a href="create.html" class="nav-item active"
        ><i class="fa-regular fa-square-plus"></i><span>Create</span></a
      >
      <a href="notifications.html" class="nav-item"
        ><i class="fa-regular fa-heart"></i><span>Activity</span></a
      >
      <a href="profile.html" class="nav-item"
        ><i class="fa-regular fa-user"></i><span>Profile</span></a
      >
    </nav>
  </body>
